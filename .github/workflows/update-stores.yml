name: Atasun mağaza XML güncelle

on:
  schedule:
    - cron: "17 3 * * *"     # her gün 06:17 (TR saati, UTC+3)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install requests beautifulsoup4

      - name: XML üret
        run: python atasun_stores_to_xml.py -o docs/stores.xml

      - name: Değişiklik varsa commit et
        run: |
          git config user.name  "atasun-store-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/stores.xml docs/changes.json
          # Sadece generated_at değiştiyse de commit edilir; böylece feed'in güncel olduğu görünür
          git diff --cached --quiet || git commit -m "Mağaza listesi güncellendi $(date -u +%F)"
          git push
